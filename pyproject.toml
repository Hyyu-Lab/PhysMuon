[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "physmuon"
version = "0.3.0"
description = "Muon with five physically derived changes (two relaxation modes, fluctuation-calibrated output budget, gated readout, tracking from step 0, fresh-share cap), plus AdamW for non-matrix parameters"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["torch>=2.1"]

[project.urls]
Repository = "https://github.com/Hyyu-Lab/PhysMuon"
Paper = "https://arxiv.org/abs/2608.22994"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["physmuon"]
